name: Build and test games
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  game:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: flags_challenge
            package: com.sulaiman.games.flags_challenge
            title: تحدي الأعلام
          - dir: color_sort
            package: com.sulaiman.games.color_sort
            title: فرز الألوان
          - dir: sky_jump
            package: com.sulaiman.games.sky_jump
            title: القفزة
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ matrix.dir }}.apk
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator and check it stays alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh ${{ matrix.dir }}/build/app/outputs/flutter-apk/app-release.apk ${{ matrix.package }}
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.dir }}-v${{ github.run_number }}
          name: ${{ matrix.title }} - نسخة ${{ github.run_number }}
          files: ${{ matrix.dir }}/build/app/outputs/flutter-apk/${{ matrix.dir }}.apk
