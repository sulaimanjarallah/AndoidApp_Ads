name: Build Flags Challenge APK
on:
  push:
    paths: ['flags_challenge/**', '.github/workflows/build-flags-challenge.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flags_challenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: flags-challenge-apk
          path: flags_challenge/build/app/outputs/flutter-apk/app-release.apk
