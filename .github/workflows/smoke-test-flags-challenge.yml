name: Smoke test Flags Challenge on emulator
on:
  push:
    paths: ['flags_challenge/**', '.github/workflows/smoke-test-flags-challenge.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build release APK
        working-directory: flags_challenge
        run: flutter pub get && flutter build apk --release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on emulator and check it stays alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh flags_challenge/build/app/outputs/flutter-apk/app-release.apk com.sulaiman.games.flags_challenge
